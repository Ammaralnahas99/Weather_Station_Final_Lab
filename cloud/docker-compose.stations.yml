x-station: &station
  build: ../weather-station
  restart: unless-stopped
  environment: &station-env
    KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_HOST}:9092
    WEATHER_TOPIC: weather-readings

services:
  weather-station-1:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "1"
  weather-station-2:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "2"
  weather-station-3:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "3"
  weather-station-4:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "4"
  weather-station-5:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "5"
  weather-station-6:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "6"
  weather-station-7:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "7"
  weather-station-8:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "8"
  weather-station-9:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "9"
  weather-station-10:
    <<: *station
    environment:
      <<: *station-env
      STATION_ID: "10"
